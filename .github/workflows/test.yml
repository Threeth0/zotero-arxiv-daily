name: Test
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4


      - name: Run script
        run: |
          uv run --frozen python -m zotero_arxiv_daily.preview --output-dir previews

      - name: Upload offline previews
        uses: actions/upload-artifact@v4
        with:
          name: email-previews
          path: previews/
